
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9fa">
  <title>MD5 to Dice Roller</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f8f9fa;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .main-card {
      border: 0;
      border-radius: 18px;
      box-shadow: 0 5px 24px rgba(0, 0, 0, .08);
    }

    .dice-container {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 24px 0;
    }

    .dice {
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #dc3545;
      color: white;
      font-size: 2rem;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(220, 53, 69, .2);
      transition: transform .2s ease;
    }

    .dice.animate {
      transform: scale(1.08);
    }

    .result-box {
      display: none;
    }

    .table-responsive {
      border-radius: 10px;
    }

    .hash-input {
      font-family: monospace;
    }

    @media (max-width: 576px) {
      .dice {
        width: 58px;
        height: 58px;
        font-size: 1.7rem;
      }

      .dice-container {
        gap: 12px;
      }

      .table {
        font-size: .8rem;
      }
    }
  </style>
</head>

<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">

        <h2 class="text-center text-primary fw-bold mb-4">
          Bộ Chuyển Đổi MD5 Thành Xúc Xắc 🎲
        </h2>

        <!-- Khu vực nhập mã -->
        <section class="card main-card p-3 p-md-4 mb-4" id="inputCard">
          <form id="md5Form">
            <label for="inputHash" class="form-label fw-semibold">
              Dán mã MD5 hoặc nhập chuỗi cần xử lý
            </label>

            <input
              type="text"
              class="form-control form-control-lg hash-input"
              id="inputHash"
              placeholder="Dán mã MD5 tại đây..."
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              maxlength="5000"
              aria-describedby="inputHelp inputStatus"
            >

            <div class="form-text mt-2" id="inputHelp">
              Mã MD5 đủ 32 ký tự hex sẽ được xử lý tự động sau khi dán.
              Với chuỗi thường, nhấn Enter hoặc nút bên dưới.
            </div>

            <div
              class="small mt-2"
              id="inputStatus"
              role="status"
              aria-live="polite"
            ></div>

            <button
              type="submit"
              class="btn btn-primary btn-lg w-100 mt-3"
              id="processBtn"
            >
              Phân tích mã
            </button>
          </form>
        </section>

        <!-- Khu vực kết quả -->
        <section
          class="card main-card p-3 p-md-4 result-box"
          id="resultBox"
          aria-live="polite"
        >
          <div class="d-flex flex-wrap justify-content-between
                      align-items-center gap-2 border-bottom pb-3 mb-3">
            <h4 class="text-success mb-0">
              Kết quả phân tích
            </h4>

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm"
              id="resetBtn"
            >
              Nhập mã khác
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-bordered table-hover
                          text-center align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Phần</th>
                  <th>Hex</th>
                  <th>Thập phân</th>
                  <th>Phép tính</th>
                  <th>Kết quả</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>

          <div class="text-center mt-4">
            <h5 class="fw-semibold">Bộ số xúc xắc</h5>

            <div class="dice-container">
              <div class="dice" id="dice1">-</div>
              <div class="dice" id="dice2">-</div>
              <div class="dice" id="dice3">-</div>
            </div>

            <h4 class="text-secondary mt-3">
              Tổng điểm:
              <span class="badge bg-secondary" id="totalScore">0</span>
            </h4>

            <p class="text-muted small mt-3 mb-0" id="resultNote"></p>
          </div>
        </section>

        <p class="text-center text-muted small mt-4">
          Công cụ tính toán cục bộ trên trình duyệt.
        </p>
      </div>
    </div>
  </main>

  <!-- CryptoJS dùng để băm chuỗi thường thành MD5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

  <script>
    "use strict";

    const inputCard = document.getElementById("inputCard");
    const inputHash = document.getElementById("inputHash");
    const inputStatus = document.getElementById("inputStatus");
    const processBtn = document.getElementById("processBtn");
    const resultBox = document.getElementById("resultBox");
    const tableBody = document.getElementById("tableBody");
    const resultNote = document.getElementById("resultNote");

    let autoProcessTimer = null;
    let isProcessing = false;

    // MD5 chuẩn gồm đúng 32 ký tự hexadecimal.
    function isValidMD5(value) {
      return /^[0-9a-f]{32}$/i.test(value);
    }

    // Nhận diện MD5 tự động, tránh xử lý khi mã còn đang được nhập.
    inputHash.addEventListener("input", function () {
      clearTimeout(autoProcessTimer);

      const value = inputHash.value.trim();

      if (!value) {
        inputStatus.textContent = "";
        return;
      }

      if (isValidMD5(value)) {
        inputStatus.className = "small mt-2 text-success";
        inputStatus.textContent = "Đã nhận diện MD5. Đang chuẩn bị xử lý...";

        // Một khoảng chờ ngắn giúp việc dán/nhập ổn định.
        autoProcessTimer = setTimeout(() => {
          if (isValidMD5(inputHash.value.trim())) {
            processMD5(inputHash.value.trim().toLowerCase(), "md5");
          }
        }, 180);
      } else {
        inputStatus.className = "small mt-2 text-muted";
        inputStatus.textContent =
          "Đang chờ đủ 32 ký tự MD5 hoặc nhấn Enter để băm chuỗi thường.";
      }
    });

    // Enter hoặc nút xử lý: MD5 hợp lệ được dùng trực tiếp;
    // chuỗi thường sẽ được băm thành MD5.
    document.getElementById("md5Form").addEventListener("submit", function (event) {
      event.preventDefault();
      clearTimeout(autoProcessTimer);

      const value = inputHash.value.trim();

      if (!value) {
        inputStatus.className = "small mt-2 text-danger";
        inputStatus.textContent = "Vui lòng nhập mã MD5 hoặc chuỗi cần xử lý.";
        inputHash.focus();
        return;
      }

      if (isValidMD5(value)) {
        processMD5(value.toLowerCase(), "md5");
      } else {
        if (typeof CryptoJS === "undefined") {
          inputStatus.className = "small mt-2 text-danger";
          inputStatus.textContent =
            "Không tải được thư viện MD5. Vui lòng kiểm tra kết nối mạng.";
          return;
        }

        const hash = CryptoJS.MD5(value).toString();
        processMD5(hash, "text");
      }
    });

    function processMD5(md5String, sourceType) {
      if (isProcessing || !isValidMD5(md5String)) return;

      isProcessing = true;
      processBtn.disabled = true;

      try {
        // Giữ nguyên công thức ban đầu: chia thành ba phần,
        // mỗi phần gồm 10 ký tự hex.
        const parts = [
          md5String.substring(0, 10),
          md5String.substring(10, 20),
          md5String.substring(20, 30)
        ];

        const results = [];
        const rows = [];

        parts.forEach((hexPart, index) => {
          const decimalValue = BigInt("0x" + hexPart);
          const diceValue = Number((decimalValue % 6n) + 1n);

          results.push(diceValue);

          const row = document.createElement("tr");

          const values = [
            "Phần " + (index + 1),
            hexPart,
            decimalValue.toString(),
            decimalValue.toString() + " % 6 + 1",
            String(diceValue)
          ];

          values.forEach((value, columnIndex) => {
            const cell = document.createElement("td");
            cell.textContent = value;

            if (columnIndex === 1) {
              cell.className = "font-monospace text-primary";
            }

            if (columnIndex === 4) {
              cell.className = "fw-bold text-danger fs-5";
            }

            row.appendChild(cell);
          });

          rows.push(row);
        });

        // Cập nhật kết quả.
        tableBody.replaceChildren(...rows);

        document.getElementById("dice1").textContent = results[0];
        document.getElementById("dice2").textContent = results[1];
        document.getElementById("dice3").textContent = results[2];

        const total = results.reduce((sum, value) => sum + value, 0);
        document.getElementById("totalScore").textContent = total;

        resultNote.textContent = sourceType === "text"
          ? "Kết quả được tính từ MD5 của chuỗi đã nhập."
          : "Kết quả được tính trực tiếp từ mã MD5 đã nhập.";

        // Ẩn vùng nhập sau khi đã có kết quả.
        inputCard.style.display = "none";
        resultBox.style.display = "block";

        // Xóa mã đầu vào khỏi ô nhập.
        inputHash.value = "";

        // Hiệu ứng nhẹ cho ba xúc xắc.
        ["dice1", "dice2", "dice3"].forEach((id) => {
          const dice = document.getElementById(id);
          dice.classList.remove("animate");
          void dice.offsetWidth;
          dice.classList.add("animate");
        });

        // Đưa kết quả vào tầm nhìn trên màn hình nhỏ.
        resultBox.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      } catch (error) {
        inputStatus.className = "small mt-2 text-danger";
        inputStatus.textContent =
          "Không thể xử lý dữ liệu. Vui lòng kiểm tra mã đầu vào.";
        console.error("MD5 processing error:", error);
      } finally {
        isProcessing = false;
        processBtn.disabled = false;
      }
    }

    // Đưa công cụ về trạng thái ban đầu.
    document.getElementById("resetBtn").addEventListener("click", function () {
      clearTimeout(autoProcessTimer);

      resultBox.style.display = "none";
      inputCard.style.display = "block";

      inputHash.value = "";
      inputStatus.textContent = "";
      tableBody.replaceChildren();

      ["dice1", "dice2", "dice3"].forEach((id) => {
        const dice = document.getElementById(id);
        dice.textContent = "-";
        dice.classList.remove("animate");
      });

      document.getElementById("totalScore").textContent = "0";
      resultNote.textContent = "";

      inputHash.focus();
    });
  </script>
</body>
</html>
