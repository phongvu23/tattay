# tattay
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 to Dice Roller - Provably Fair</title>
    <!-- Nhúng thư viện Bootstrap để giao diện đẹp mắt -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .dice-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .dice { width: 60px; height: 60px; background-color: #dc3545; color: white; font-size: 2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .result-box { display: none; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h2 class="mb-4 text-primary" id="webTitle">Bộ Chuyển Đổi MD5 Thành Xúc Xắc ⚄</h2>
            
            <!-- Khối nhập liệu (Sẽ biến mất sau khi dán mã) -->
            <div class="card p-4 bg-white mb-4" id="inputCard">
                <div class="mb-3 text-start">
                    <label for="inputHash" class="form-label fw-bold">Dán mã MD5 vào đây để xem kết quả:</label>
                    <!-- Sức mạnh ở đây: Bắt sự kiện onpaste để tự động chạy -->
                    <input type="text" class="form-control form-control-lg" id="inputHash" placeholder="Chuột phải -> Dán (Paste) vào đây..." onpaste="handlePaste(event)" autocomplete="off">
                </div>
                <small class="text-muted text-start">Hệ thống tự động xử lý ngay khi bạn vừa dán mã xong.</small>
            </div>

            <!-- Khối hiển thị kết quả (Chỉ hiển thị bảng tính toán và xúc xắc) -->
            <div id="resultBox" class="card p-4 bg-white text-start result-box">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                    <h4 class="text-success m-0">Kết Quả Phân Tích Xúc Xắc</h4>
                    <!-- Nút bấm để quay lại nhập mã khác nếu cần -->
                    <button class="btn btn-outline-secondary btn-sm" onclick="resetForm()">Nhập mã khác</button>
                </div>
                
                <table class="table table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>Phần (10 ký tự)</th>
                            <th>Hệ 16 (Hex)</th>
                            <th>Hệ 10 (Thập phân)</th>
                            <th>Công thức (%6 + 1)</th>
                            <th>Kết quả</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>

                <div class="text-center mt-4">
                    <h5>Bộ Số Xúc Xắc:</h5>
                    <div class="dice-container">
                        <div class="dice" id="dice1">-</div>
                        <div class="dice" id="dice2">-</div>
                        <div class="dice" id="dice3">-</div>
                    </div>
                    <h4 class="mt-3 text-secondary">Tổng điểm: <span id="totalScore" class="badge bg-secondary">0</span></h4>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Nhúng thư viện Crypto JS để tính toán mã hóa an toàn phòng trường hợp chuỗi dán vào là text thường -->
<script src="https://cloudflare.com"></script>
<script>
function handlePaste(event) {
    // Lấy dữ liệu từ clipboard ngay khi người dùng dán vào
    let pastedData = (event.clipboardData || window.clipboardData).getData('text');
    if (pastedData) {
        // Chờ 50ms để dữ liệu ổn định rồi xử lý dữ liệu
        setTimeout(() => {
            processMD5(pastedData.trim().toLowerCase());
        }, 50);
    }
}

function processMD5(input) {
    if (!input) return;

    let md5String = input;
    // Nếu chuỗi dán vào không phải cấu trúc chuẩn MD5 (32 ký tự hệ 16), tự động hash nó thành MD5
    if (input.length !== 32 || !/^[0-9a-f]{32}\$/.test(input)) {
        md5String = CryptoJS.MD5(input).toString();
    }

    // Cắt 3 phần cố định (mỗi phần 10 ký tự)
    let p1 = md5String.substring(0, 10);
    let p2 = md5String.substring(10, 20);
    let p3 = md5String.substring(20, 30);

    let parts = [p1, p2, p3];
    let html = '';
    let results = [];

    parts.forEach((hexPart, index) => {
        let decValue = BigInt("0x" + hexPart);
        let finalNum = Number((decValue % 6n) + 1n);
        results.push(finalNum);

        html += `
            <tr>
                <td>Phần ${index + 1}</td>
                <td class="font-monospace text-primary">${hexPart}</td>
                <td class="small text-truncate" style="max-width: 200px;">${decValue.toString()}</td>
                <td>${decValue.toString().slice(-4)} % 6 + 1</td>
                <td class="fw-bold text-danger fs-5">${finalNum}</td>
            </tr>
        `;
    });

    // Cập nhật dữ liệu vào bảng
    document.getElementById('tableBody').innerHTML = html;

    // Hiển thị các viên xúc xắc
    document.getElementById('dice1').innerText = results[0];
    document.getElementById('dice2').innerText = results[1];
    document.getElementById('dice3').innerText = results[2];

    // Tính tổng điểm
    document.getElementById('totalScore').innerText = results[0] + results[1] + results[2];

    // ẨN khối nhập liệu và hiển thị khối kết quả
    document.getElementById('inputCard').style.display = 'none';
    document.getElementById('resultBox').style.display = 'block';
    
    // Xóa nội dung trong ô input cũ để bảo mật
    document.getElementById('inputHash').value = '';
}

function resetForm() {
    // Hiển thị lại ô nhập dữ liệu ban đầu
    document.getElementById('inputCard').style.display = 'block';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('inputHash').focus();
}
</script>
</body>
</html>
